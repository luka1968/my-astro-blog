name: Daily Build Trigger

on:
  schedule:
    # 每天 UTC 时间凌晨 2 点 (北京时间上午 10 点) 触发
    - cron: '0 2 * * *'
  # 允许你在 GitHub 网页端手动点击按钮来触发测试
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        # 我们使用 curl 发送一个 POST 请求来触发构建
        # 注意：不要把真实的 URL 写死在代码里，这样不安全。
        # 请去 GitHub 仓库的 Settings -> Secrets and variables -> Actions 里，
        # 创建一个名为 DEPLOY_HOOK_URL 的 Secret，填入你的部署链接。
        run: curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
